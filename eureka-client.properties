# если указан "0", то номер порта присваивается автоматически, если нужно указать конкретный порт, то для клиентов начинаем с 8080
server.port=0

# url - куда будет происходить регистрация микросервисов
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# отключение лишних логов
logging.level.com.netflix.eureka=OFF
logging.level.com.netflix.discovery=OFF

# настройка цветов длят лога
spring.output.ansi.enabled=DETECT

# формат вывода логов
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr([%thread]){magenta} %clr([%-5level]) %clr(%logger{36}){cyan} - %msg%n

# для того чтобы каждый инстенс имел уникальный id
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

tmpVar=100
