# url - куда будет происходить регистрация микросервисов
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# отключение лишних логов
logging.level.com.netflix.eureka=OFF
logging.level.com.netflix.discovery=OFF

# запрещает пересоздавать/перерегистрировать Eureka client при /actuator/refresh. Обычные properties, например tmpVar, продолжат обновляться.
eureka.client.refresh.enable=false
